name: ci

# Linux runs on every push and pull request. Windows and macOS minutes cost more,
# so those run on pushes to main, on a manual run (Actions > ci > Run workflow),
# and on pull requests labelled `full-ci`.
on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  # a run for an unrelated label gets its own group, so it never cancels a real run
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cpp:
    # adding some other label to a PR needs no new run
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    name: c++ (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))) && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: build
        shell: bash
        # a bare --parallel means unlimited make jobs, which runs the runner out of memory
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 4 2>&1 | tee build.log
      - name: ffmpeg
        # the video tests only export real files when ffmpeg is there, so every OS gets it
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null; then ffmpeg -hide_banner -version | head -1; exit 0; fi
          case "$RUNNER_OS" in
            Windows) choco install ffmpeg -y --no-progress ;;
            macOS) brew install ffmpeg ;;
            Linux) sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg ;;
          esac
      - name: test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build -C Release --output-on-failure 2>&1 | tee test.log
      - name: report failures
        if: failure()
        shell: bash
        run: |
          # surface the end of the build and test logs as single multi-line annotations,
          # readable through the API without downloading the full log
          for f in build.log test.log; do
            [ -f "$f" ] || continue
            body=$(grep -viE "^\s*$|Building CXX|Linking CXX|Passed" "$f" | tail -120 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' || true)
            echo "::error title=$f::$body"
            # annotations are cut at a few KB, so also send just the error lines and their context
            errs=$(grep -iE -B2 -A4 "error|FAILED|fatal" "$f" | grep -viE "^\s*$|warning C|-Werror|Errors while running CTest" | head -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' || true)
            if [ -n "$errs" ]; then echo "::error title=$f errors::$errs"; fi
          done

  hub:
    # adding some other label to a PR needs no new run
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    name: hub (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))) && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - name: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee test.log
      - name: lint
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --locked -- -D warnings
      - name: build
        run: cargo build --release --locked
      - name: report failures
        if: failure()
        shell: bash
        run: |
          [ -f test.log ] || exit 0
          body=$(grep -iE "panicked|FAILED|failures:|assert|left:|right:|error" test.log | tail -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' || true)
          echo "::error title=test.log::$body"

  share:
    # adding some other label to a PR needs no new run
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    name: share (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))) && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: share
    steps:
      - uses: actions/checkout@v4
      - name: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee test.log
      - name: lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: build
        run: cargo build --release --locked
      - name: report failures
        if: failure()
        shell: bash
        run: |
          [ -f test.log ] || exit 0
          body=$(grep -iE "panicked|FAILED|failures:|assert|left:|right:|error" test.log | tail -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' || true)
          echo "::error title=test.log::$body"
