name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp:
    name: c++ (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2>&1 | tee build.log
      - name: test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build -C Release --output-on-failure 2>&1 | tee test.log
      - name: report failures
        if: failure()
        shell: bash
        run: |
          # surface compiler errors and failed checks as annotations, readable without the full log
          { grep -hiE "error[: ]|error C[0-9]" build.log 2>/dev/null | head -30
            grep -hE "FAILED|\*\*\*|Exception|exception|what\(\)|Assertion|Could not" test.log 2>/dev/null | head -40; } | sed 's/^/::error::/' || true

  hub:
    name: hub (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - name: test
        run: cargo test --locked
      - name: lint
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --locked -- -D warnings
      - name: build
        run: cargo build --release --locked
