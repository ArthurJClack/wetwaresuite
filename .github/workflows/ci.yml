name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp:
    name: c++ (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2>&1 | tee build.log
      - name: test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build -C Release --output-on-failure 2>&1 | tee test.log
      - name: report failures
        if: failure()
        shell: bash
        run: |
          # surface the end of the build and test logs as single multi-line annotations,
          # readable through the API without downloading the full log
          for f in build.log test.log; do
            [ -f "$f" ] || continue
            body=$(grep -viE "^\s*$|Building CXX|Linking CXX|Passed" "$f" | tail -120 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=$f::$body"
            # annotations are cut at a few KB, so also send just the error lines and their context
            errs=$(grep -iE -B2 -A4 "error|FAILED|fatal" "$f" | grep -viE "^\s*$|warning C|-Werror|Errors while running CTest" | head -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            if [ -n "$errs" ]; then echo "::error title=$f errors::$errs"; fi
          done

  hub:
    name: hub (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - name: test
        run: cargo test --locked
      - name: lint
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --locked -- -D warnings
      - name: build
        run: cargo build --release --locked
