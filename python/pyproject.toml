[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "achclwss"
version = "0.4.0"
description = "Drive the ACHCLWSS creative suite from Python: every command as a method, previews as bytes"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-only" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]

[tool.setuptools]
packages = ["achclwss"]
