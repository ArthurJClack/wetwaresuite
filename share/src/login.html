<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join share</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--text:#1d1d1b;--muted:#6b6b66;--line:#e4e4df;--accent:#2b6cb0;--danger:#c53030}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--panel:#1f1f1e;--text:#ececea;--muted:#9a9a94;--line:#33332f;--accent:#63a4e8;--danger:#fc8181}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;width:100%;max-width:360px}
h1{font-size:18px;margin:0 0 6px}
p{color:var(--muted);margin:0 0 16px;font-size:14px}
input{width:100%;font:600 24px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.25em;text-transform:uppercase;text-align:center;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
button{margin-top:12px;width:100%;font:inherit;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
#err{color:var(--danger);font-size:14px;min-height:1.5em;margin-top:8px}
</style>
</head>
<body>
<form id="f">
  <h1>Join a shared folder</h1>
  <p>Type the 6-character code shown where the share was started, or open the full link it printed.</p>
  <input id="code" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Pairing code" autofocus>
  <button>Join</button>
  <div id="err"></div>
</form>
<script>
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const r = await fetch("/api/pair", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({code: document.getElementById("code").value})});
  if(r.ok) location.replace("/");
  else document.getElementById("err").textContent = ((await r.json().catch(() => ({}))).error) || "Wrong code";
};
</script>
</body>
</html>
